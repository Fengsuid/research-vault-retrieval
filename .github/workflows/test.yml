name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  skill-spec:
    name: SKILL.md spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill frontmatter
        run: |
          python - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")
          skill = root / "SKILL.md"
          text = skill.read_text(encoding="utf-8")
          match = re.match(r"\A---\n(.*?)\n---\n", text, re.S)
          if not match:
              sys.exit("SKILL.md: missing YAML frontmatter")
          frontmatter = match.group(1)
          name = re.search(r"(?m)^name:\s*(.+)$", frontmatter)
          description = re.search(r"(?ms)^description:\s*(.+?)(?=\n[a-z_]+:|\Z)", frontmatter)
          if not name or not description:
              sys.exit("SKILL.md: name and description are required")
          value = name.group(1).strip().strip('"\'')
          if not re.fullmatch(r"[a-z0-9-]{1,64}", value):
              sys.exit(f"SKILL.md: invalid name {value!r}")
          if value != root.name:
              sys.exit(f"SKILL.md: name {value!r} must match the directory {root.name!r}")
          length = len(" ".join(description.group(1).strip().strip('"\'').split()))
          if length > 1024:
              sys.exit(f"SKILL.md: description is {length} characters (max 1024)")

          required = ["scripts/rv_retrieval.py", "references/retrieval-routing.md",
                      "references/evidence-levels.md", "references/output-contract.md"]
          missing = [item for item in required if not (root / item).is_file()]
          if missing:
              sys.exit("missing files: " + ", ".join(missing))
          print(f"OK: name={value}, description={length} chars")
          PY

      - name: Check CLI help
        run: python scripts/rv_retrieval.py --help > /dev/null
